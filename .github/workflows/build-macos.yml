# 在 GitHub 托管的 macOS runner（真 Apple silicon Mac）上自动构建
# 微信客户沟通总结工具 的 .app / .dmg 安装包。
#
# 触发方式：
#   1) 把本仓库 push 到 GitHub（默认即构建并打 .dmg）；
#   2) 或在 Actions 页面手动「Run workflow」（可关掉 .dmg）。
#
# 产物：GitHub Actions 的 Artifacts（名为 wxcsm-macos）里下载：
#   - 微信客户沟通总结工具安装向导.app   （双击即安装向导，可选目录 + 桌面替身）
#   - 微信客户沟通总结工具安装向导.dmg   （拖拽安装，更便于分发）
#
# 关于 WeChatDataAnalysis 内嵌：
#   仓库里 tools/ 已被 .gitignore 忽略（WDA 安装包体积大，不适合进 git），
#   所以本 CI 默认产出【不含 WDA】的精简版。
#   若要 CI 直接产出【内嵌 WDA】的全量版：手动 Run workflow 时填 wda_url
#   （macOS 版 WeChatDataAnalysis 安装包直链，如
#   https://github.com/LifeArchiveProject/WeChatDataAnalysis/releases/download/v2.3.0/WeChatDataAnalysis-2.3.0-mac-arm64.dmg），
#   云端 runner 会现下现嵌。也可在自己 Mac 上本地 `python make_macos.py --dmg` 构建。
name: Build macOS .app

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      with_dmg:
        description: "额外打成 .dmg 便于分发"
        type: boolean
        default: true
      wda_url:
        description: "macOS 版 WeChatDataAnalysis 安装包直链（留空=不含WDA的精简版；填入则自动下载并内嵌）"
        type: string
        default: ""

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 准备 Python（用系统 python3，自带 tkinter）
        run: |
          /usr/bin/python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -c "import tkinter, sys; print('tkinter OK, Tk', tkinter.TkVersion, 'py', sys.version.split()[0])"

      - name: 构建安装向导 .app（提供 wda_url 则自动下载并内嵌 WDA）
        run: |
          . .venv/bin/activate
          WDA_ARG=""
          if [ -n "${{ inputs.wda_url }}" ]; then
            WDA_ARG="--wda-url ${{ inputs.wda_url }}"
          fi
          python make_macos.py --dmg $WDA_ARG

      - name: 列出产物
        run: ls -lh dist_installer

      - name: 上传 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wxcsm-macos
          path: |
            dist_installer/*.app
            dist_installer/*.dmg
          if-no-files-found: warn
          retention-days: 30
