# 在 GitHub 托管的 macOS runner(Apple silicon)上构建 macOS 版并上传产物。
# 触发:
#   1) push 到 main/master; 或
#   2) Actions 页手动 Run workflow(可选打 .dmg)。
# 产物: Actions Artifact(名 wxcsm-macos)里下载 .dmg / .app.tar.gz。
#
# 校验(verify_macos.py, 在真 macOS 上跑):
#   · .app 结构: Info.plist / 可执行权限位 / 符号链接 / _tkinter / 动态库依赖可解析
#   · .dmg: UDIF 签名 / hdiutil verify / 挂载 / 镜像内 .app 符号链接 / 卸载
#   · mac_wx4 自检: 真 Darwin 上 import / IS_MAC / 注册表含 wx4mac / detect 正常退出 / 密码学库可用
#   · 启动冒烟: 拉起 .app 观察是否秒退(区分"缺库崩溃"与"环境无显示")
#
# 关于分发格式: artifact 的 zip 不保留符号链接与权限位(经 Windows 解压会破坏 .app),
#   故额外用 tar 打包 .app.tar.gz(tar 保留符号链接), 并以 .dmg 作为首选分发格式。
#
# 说明: 本工具 wx4「直读本机微信(Windows 4.x)」为 Windows 专属; macOS 版支持
#       demo / 导入文件 / 已解密库 数据源 + 本地/AI 总结 + Excel 导出。
#       macOS 微信数据直读需真机(装有微信并登录), Runner 上只做模块级自检。
name: Build macOS

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      with_dmg:
        description: "额外打 .dmg 便于分发"
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 Python(系统 python3 自带 tkinter)
        run: |
          /usr/bin/python3 -c "import tkinter; print('tkinter OK, Tk', tkinter.TkVersion)"
          /usr/bin/python3 -m pip install --user --quiet pyinstaller
          # 安装运行依赖(openpyxl/requests/pycryptodome/zstandard), 否则 import 自检/构建会因缺 openpyxl 失败
          /usr/bin/python3 -m pip install --user --quiet -r requirements.txt

      - name: 语法自检(确保改动能 import)
        run: |
          # 逐个列出功能模块: 只 import app 其实也能覆盖, 但分开写在失败时能直接
          # 看出是哪个模块坏了。新加的功能(问答清单/名称库/候选发现)都在这条线上。
          /usr/bin/python3 - <<'PY'
          import sys
          sys.path.insert(0, '.')
          import core.sources, core.summarizer, core.exporter
          import core.qa_extract, core.qa_ai, core.name_library, core.self_discover
          import cli, app
          print('import OK on darwin:', sys.platform)
          PY

      - name: "单元测试（纯逻辑，不碰微信/网络/显示）"
        run: |
          # 这些用例只依赖标准库 + openpyxl, 在 runner 上可以实跑。
          # 特意不含 test_ai_settings.py: 它会**真实调用大模型**(要配置 key 和网络),
          # runner 上没有, 放进来只会让 CI 无故变红。
          set -e
          for t in test_qa_extract test_qa_ai test_name_library test_self_discover test_wx4_cipher test_macos_packaging; do
            echo "===== $t ====="
            /usr/bin/python3 "tests/$t.py"
          done

      - name: 构建 .app
        run: |
          # 默认连 .dmg 一起打：.dmg 是首选分发格式（自包含，符号链接与权限位都完好）。
          # 原先只在手动 workflow_dispatch 且勾选 with_dmg 时才加 --dmg，而 push 触发的
          # 构建拿不到这个输入 —— 于是产物里只有 .app.tar.gz，没有 .dmg，而且校验那步
          # 同样判断，把"缺 dmg"一起放过了。现在默认必打，手动触发时可显式关掉。
          DMG_ARG="--dmg"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.with_dmg }}" = "false" ]; then
            DMG_ARG=""
          fi
          /usr/bin/python3 make_macos.py $DMG_ARG

      - name: "冒烟测试产物（demo 数据源，非 wx4）"
        run: |
          /usr/bin/python3 cli.py run --source demo --all --preset 30d --out /tmp/mac_demo.xlsx
          ls -lh /tmp/mac_demo.xlsx
          # 名称库与 Excel 的闭环(导出模版 → 导回)也走一遍: 这条路径在 mac 上
          # 同样是纯 Python + openpyxl, 没有平台差异, 但值得每次都验。
          /usr/bin/python3 cli.py config --add-library "张三,李四" --export-template /tmp/tpl.xlsx
          /usr/bin/python3 cli.py config --import-library /tmp/tpl.xlsx --force
          ls -lh /tmp/tpl.xlsx

      - name: "校验构建产物（.app 结构 / 符号链接 / 依赖 / .dmg / mac_wx4 自检 / 启动冒烟）"
        run: |
          # 默认要求 .dmg 必须存在：它就是这次要分发的东西，缺了就该让构建失败，
          # 而不是发一个只有 .app.tar.gz 的包出去（push 触发的构建曾经就是这样）。
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.with_dmg }}" = "false" ]; then
            /usr/bin/python3 verify_macos.py
          else
            /usr/bin/python3 verify_macos.py --require-dmg
          fi

      - name: "打包 .app 为 tar.gz（保留符号链接与权限，避免 zip 传输损坏）"
        run: |
          cd dist_mac
          tar -czf "绿泡泡聊天记录总结.app.tar.gz" "绿泡泡聊天记录总结.app"
          ls -lh *.tar.gz *.dmg 2>/dev/null || ls -lh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: wxcsm-macos
          path: |
            dist_mac/*.dmg
            dist_mac/*.app.tar.gz
          if-no-files-found: warn
          retention-days: 30
